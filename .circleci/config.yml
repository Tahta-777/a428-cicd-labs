version: 2.1

executors:
  node-executor:
    docker:
      - image: node:18
    environment:
      NODE_OPTIONS: "--openssl-legacy-provider"
    working_directory: ~/project

jobs:
  build-test-deploy:
    executor: node-executor

    steps:
      - checkout

      - restore_cache:
          keys:
            - node-deps-{{ checksum "package.json" }}
            - node-deps-

      - run:
          name: Install dependencies
          command: npm install

      - save_cache:
          key: node-deps-{{ checksum "package.json" }}
          paths:
            - ./node_modules

      - run:
          name: Build app
          command: npm run build

      - run:
          name: Serve and test in same step
          command: |
            npm install --no-save serve
            npx serve -s build -l 3000 &
            sleep 5
            curl -sSf http://localhost:3000 || (echo "Server did not respond!" && exit 1)

      - run:
          name: Deploy to Vercel
          command: |
            npm install -g vercel
            vercel --prod --token $VERCEL_TOKEN --confirm --yes
            echo "Deployed to Vercel successfully."

workflows:
  version: 2
  build-test-deploy-workflow:
    jobs:
      - build-test-deploy